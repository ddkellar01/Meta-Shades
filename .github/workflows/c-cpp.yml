name: C/C++ CI (PlatformIO Firmware)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO Core
      run: pip install --upgrade platformio

    - name: Compile ESP32 Firmware
      run: |
        cd firmware
        pio run