name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f hub-backend/requirements.txt ]; then
            pip install -r hub-backend/requirements.txt
          fi
          pip install pytest

      - name: Verify ML engine import
        env:
          PYTHONPATH: ${{ github.workspace }}/hub-backend/src
        run: |
          python -c "from ml_engine.blood_pressure import BloodPressureEstimator; print('ML engine import OK')"

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/hub-backend/src
        run: |
          python -m pytest hub-backend/tests -v