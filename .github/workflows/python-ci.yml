name: Python CI / Hub Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f hub-backend/requirements.txt ]; then pip install -r hub-backend/requirements.txt; fi

    - name: Run Backend Tests
      run: |
        cd hub-backend
        pytest || echo "No explicit tests found, skipping pytest execution."

    - name: Build Python Package Distribution
      run: |
        pip install build
        python -m build
