[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-shades-backend"
version = "0.1.0"
description = "Backend service with ML engine"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["ml_engine", "ml_engine.nn"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
